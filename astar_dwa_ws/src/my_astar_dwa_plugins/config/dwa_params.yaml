ImprovedDWALocalPlanner:
  # DWA算法参数配置（与原导航文件一致）
  max_vel_x: 0.22              # 最大线速度
  min_vel_x: 0.0               # 最小线速度
  max_vel_theta: 2.75          # 最大角速度
  min_vel_theta: -2.75         # 最小角速度
  acc_lim_x: 2.5               # 线加速度限制
  acc_lim_theta: 3.2           # 角加速度限制
  vx_samples: 20               # 线速度采样数
  vth_samples: 40              # 角速度采样数
  sim_time: 1.5                # 模拟时间
  dt: 0.1                      # 模拟步长
  xy_goal_tolerance: 0.15      # XY目标容差
  yaw_goal_tolerance: 0.17     # 航向目标容差
  path_distance_bias: 32.0     # 路径距离权重
  goal_distance_bias: 20.0     # 目标距离权重
  robot_radius: 0.25           # 机器人半径
  controller_frequency: 10.0   # 控制频率
  lookahead_dist: 1.5          # 前瞻距离